# THE PROTOCOL — set once, before any search has run.
# Editing this after results exist invalidates every comparison made
# before the edit. If you must, record why in docs/decisions/ and
# reset walk_forward_touches to 0.
protocol_version: 1
created: "2026-08-21"

instruments:
  research: "SPY"
  execution: "VUAG.L"

windows:
  in_sample:    {start: "2005-01-01", end: "2018-12-31"}
  # fold_months is a fold LENGTH, not a fold count: 12 means each test
  # fold covers twelve months, so this window yields six folds.
  walk_forward: {start: "2019-01-01", end: "2024-12-31", fold_months: 12}

costs:
  # PERCENT, not fractions. 0.05 means 0.05%, which is five basis points.
  # load_protocol converts these to fractions exactly once, at the file
  # boundary; CostModel carries fractions and apply_costs never sees a
  # percent. tests/test_protocol.py asserts that conversion.
  commission_pct: 0.05
  spread_pct: 0.03
  slippage_pct: 0.05
  # These two are DECIDED at zero, not omitted. Both were absent before, which
  # defaults them to zero and reads as "never considered" - the difference
  # matters, because a cost silently at zero is the single most effective way to
  # turn a losing strategy into a winning one. See
  # docs/decisions/0004-two-cost-components-decided-at-zero.md.
  #
  # commission_min_flat: the execution account is a Trading 212 stocks and
  # shares ISA, which charges no commission and no per-trade minimum.
  #
  # fx_conversion_pct: the execution instrument VUAG.L is GBP-denominated on the
  # LSE, so a GBP account converts nothing to buy it. This zero is a property of
  # THAT PAIRING, not of the broker: executing SPY directly from a GBP account
  # would attract a conversion charge and this number would be wrong.
  commission_min_flat: 0.0
  fx_conversion_pct: 0.0

validation:
  primary_metric: sharpe
  # Annualised Sharpe floor, before the pass margin is added.
  min_sharpe: 1.0
  # Below this many trades, that FOLD reports insufficient_data.
  min_trades_per_fold: 10
  # Below this many trades pooled across all folds, the whole
  # VALIDATION reports insufficient_data. The pooled figure carries the
  # pass decision, so it needs its own honest floor.
  min_trades_pooled: 30
  # Reject regardless of return above this drawdown, in percent.
  max_drawdown_ceiling_pct: 25.0
  # ADDITIVE margin on min_sharpe. The effective bar is
  # min_sharpe + pass_margin = 1.20. A marginal pass is a fail.
  pass_margin: 0.20

access_log:
  walk_forward_touches: 0
