[project]
name = "strategylab"
version = "0.1.0"
description = "Backtesting, validation, and paper-trading pipeline for systematic trading strategies."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
strategylab = "strategylab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategylab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# .claude/ holds the session prompts and hook scripts. Their fenced Python blocks
# are specifications, not source, and the formatter must not rewrite them.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
# One mutant per line. The text to find is quoted from the source exactly, so it is as
# long as the line it names and cannot be wrapped without changing what it matches.
"tests/mutation/mutants.py" = ["D100", "D103", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The web framework's test client warns that it would prefer a newer HTTP
# library than the one this project already depends on. Adding a dependency to
# quiet a warning is the wrong trade; the warning is named here so that it is
# this one that is silenced and no other.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
