# Repository-level guards. These travel with the repo, so anyone who clones it
# gets the same protection the original author had. Install with:
#   uv run pre-commit install
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # tests/fixtures holds recorded market data; uv.lock holds hashes.
        # Both are high-entropy and neither can contain a credential.
        exclude: ^(tests/fixtures/|uv\.lock$)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
