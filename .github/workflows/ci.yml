name: CI

on:
  push:
  pull_request:

# No step in this workflow makes a network call beyond installing declared
# dependencies. The price-data fetch path is exercised against recorded
# fixtures only: a badge that goes red because a vendor rate-limited us is
# worse than no badge, because it trains everyone to ignore the badge.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is deliberately absent. numpy's type stubs use PEP 695 `type`
        # statements, which mypy cannot parse when targeting 3.11, and
        # mypy --strict is a gate here rather than a suggestion.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Check formatting
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type check
        run: uv run --python ${{ matrix.python-version }} mypy src/ tests/

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -v
