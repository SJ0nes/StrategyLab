<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrategyLab App Prototype</title>
<style>
  /* Layout idea: a trading dashboard. Top bar holds the strategy switcher and its status; a left rail holds six
     sections; the work area opens on the Dashboard for the chosen strategy. Window-high shell, scrolling inside
     the work area only; root font size follows window width so it fills a laptop or a 2560 monitor alike.
     Colours are the project's own report tokens; one accent, semantic green/red for gain and loss. */
  :root {
    --font: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --font-text: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    --t-xs: .8rem; --t-s: .9rem; --t-m: 1rem; --t-l: 1.3rem; --t-xl: 1.9rem;
    --s1: .25rem; --s2: .5rem; --s3: 1rem; --s4: 1.5rem; --s5: 2rem;
    --nav-w: 13rem; --r: .6rem; --ease: cubic-bezier(.2, .8, .2, 1);
    --ink: #16181d; --ink-soft: #5c6270; --rule: #d9dce3;
    --page: #ffffff; --panel: #f6f7f9; --rail: #eef0f4;
    --accent: #ff5f1f; --accent-ink: #b23c08; --accent-bg: #fff1ea;
    --good: #1a7f4b; --good-bg: #e6f4ec; --bad: #b3261e; --bad-bg: #fbeae8;
    --warn: #8a5a00; --warn-bg: #fff6ea; --warn-rule: #e0a558;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ink: #e7e9ee; --ink-soft: #99a0ae; --rule: #2c313b; --page: #14161a; --panel: #1b1e24; --rail: #101216;
      --accent-ink: #ff8a57; --accent-bg: #2b1a12; --good: #5fd08f; --good-bg: #12281c; --bad: #ff8a80; --bad-bg: #2e1614;
      --warn: #e6b566; --warn-bg: #2a2113; --warn-rule: #8a6427;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #e7e9ee; --ink-soft: #99a0ae; --rule: #2c313b; --page: #14161a; --panel: #1b1e24; --rail: #101216;
    --accent-ink: #ff8a57; --accent-bg: #2b1a12; --good: #5fd08f; --good-bg: #12281c; --bad: #ff8a80; --bad-bg: #2e1614;
    --warn: #e6b566; --warn-bg: #2a2113; --warn-rule: #8a6427;
  }
  * { box-sizing: border-box; }
  html { height: 100%; font-size: clamp(12.5px, 7.5px + .37vw, 17px); }
  body { height: 100%; margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-text); font-size: var(--t-m); line-height: 1.45; font-variant-numeric: tabular-nums; }
  .app { height: 100%; display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  .sample { grid-column: 1 / -1; background: var(--warn-bg); border-bottom: 1px solid var(--warn-rule); color: var(--warn); padding: var(--s1) var(--s3); font-size: var(--t-xs); }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; padding: var(--s2) var(--s4); border-bottom: 1px solid var(--rule); }
  .brand { font-family: var(--font); font-weight: 700; letter-spacing: .04em; width: calc(var(--nav-w) - var(--s4)); }
  .brand span { color: var(--accent-ink); }
  .pick { display: flex; align-items: center; gap: var(--s2); }
  .pick label { font-size: var(--t-xs); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  select { font: inherit; font-weight: 600; padding: .45rem 2rem .45rem .8rem; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); color: var(--ink); cursor: pointer; }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: var(--s3); }
  nav { background: var(--rail); border-right: 1px solid var(--rule); padding: var(--s3) var(--s2); display: flex; flex-direction: column; gap: var(--s1); overflow-y: auto; }
  nav a { padding: .6rem var(--s3); border-radius: var(--r); color: var(--ink-soft); text-decoration: none; font-weight: 600; }
  nav a:hover { background: var(--panel); color: var(--ink); }
  nav a[aria-current="page"] { background: var(--page); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
  nav .grp { font-size: var(--t-xs); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: var(--s3) var(--s3) var(--s1); }
  main { min-width: 0; min-height: 0; overflow: auto; padding: var(--s4) var(--s5) var(--s5); }
  .wrap { display: flex; flex-direction: column; gap: var(--s4); min-height: 100%; animation: rise .3s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }
  h1 { font-size: var(--t-xl); margin: 0; font-weight: 650; line-height: 1.15; }
  h2 { font-size: var(--t-m); margin: 0; font-weight: 600; }
  p { margin: 0; } .soft { color: var(--ink-soft); } .mono { font-family: var(--font); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s3); flex-wrap: wrap; }
  .head p { color: var(--ink-soft); margin-top: .2rem; max-width: 65ch; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: var(--s3); }
  .kpi { gap: var(--s1); }
  .label { font-size: var(--t-xs); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .big { font: 600 var(--t-xl)/1.15 var(--font); }
  .up { color: var(--good); } .down { color: var(--bad); }
  .kpi small { color: var(--ink-soft); font-size: var(--t-s); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(16rem, 1fr); gap: var(--s3); }
  .pill { display: inline-block; font-size: var(--t-xs); font-weight: 600; padding: .1rem .7rem; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-soft); white-space: nowrap; }
  .pill.good { color: var(--good); background: var(--good-bg); border-color: transparent; }
  .pill.bad { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
  .pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .live { display: inline-flex; align-items: center; gap: .4rem; }
  .live i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: beat 1.8s infinite; }
  .live.off i { background: var(--warn-rule); animation: none; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(26,127,75,.5); } 100% { box-shadow: 0 0 0 .55rem rgba(26,127,75,0); } }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; background: var(--page); }
  .seg button { border: 0; background: none; color: var(--ink-soft); font: inherit; font-size: var(--t-s); padding: .25rem .8rem; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  button.btn { font: inherit; font-weight: 600; padding: .55rem 1.1rem; border-radius: var(--r); border: 1px solid var(--rule); background: var(--page); color: var(--ink); cursor: pointer; transition: transform .15s var(--ease), border-color .15s; }
  button.btn:hover { border-color: var(--ink-soft); transform: translateY(-1px); }
  button.btn.primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
  button.btn.go { background: var(--accent); color: #1a0d06; border-color: var(--accent); }
  button.btn.small { padding: .35rem .8rem; font-size: var(--t-s); white-space: nowrap; }
  button.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
  a.more { color: var(--accent-ink); font-weight: 600; font-size: var(--t-s); text-decoration: none; } a.more:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .term { border-bottom: 1px dotted var(--ink-soft); cursor: help; position: relative; }
  .term:hover::after, .term:focus::after { content: attr(data-def); position: absolute; left: 0; top: 100%; z-index: 5; width: 17rem; background: var(--ink); color: var(--page);
    font: 400 var(--t-s)/1.4 var(--font-text); padding: var(--s2) var(--s3); border-radius: var(--r); margin-top: var(--s1); white-space: normal; text-transform: none; letter-spacing: 0; }
  .tablewrap { overflow: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: var(--t-xs); font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }
  th, td { padding: .5rem var(--s3) .5rem 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; font-family: var(--font); padding-right: 0; }
  .rows { display: flex; flex-direction: column; }
  .rowi { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding: .5rem 0; border-bottom: 1px solid var(--rule); }
  .rowi:last-child { border-bottom: 0; } .rowi small { color: var(--ink-soft); display: block; font-size: var(--t-s); }
  svg { display: block; width: 100%; height: auto; } svg text { font-family: var(--font); font-size: 11px; fill: var(--ink-soft); }
  .gauge .top2 { display: flex; justify-content: space-between; margin-bottom: var(--s1); font-size: var(--t-s); }
  .track { height: .55rem; background: var(--rule); border-radius: 999px; overflow: hidden; } .track i { display: block; height: 100%; background: var(--good); border-radius: 999px; }
  .heat { display: grid; grid-template-columns: auto repeat(6, minmax(2.4rem, 1fr)); gap: .25rem; }
  .heat .lab { font: var(--t-xs) var(--font); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; padding: 0 var(--s2); }
  .cell { border: 0; border-radius: .3rem; height: 2.7rem; font: 600 var(--t-s) var(--font); cursor: pointer; position: relative; min-width: 0; transition: transform .12s var(--ease); }
  .cell:hover { transform: scale(1.06); z-index: 1; } .cell.sel { outline: .2rem solid var(--accent); outline-offset: 1px; z-index: 1; }
  .cell.live::before { content: "LIVE"; position: absolute; top: .1rem; left: .25rem; font-size: .55rem; letter-spacing: .05em; }
  .cell.best::after { content: "★"; position: absolute; top: .05rem; right: .3rem; font-size: var(--t-xs); }
  input[type=text] { font: inherit; padding: .5rem .7rem; border: 1px solid var(--rule); border-radius: var(--r); background: var(--page); color: var(--ink); }
  .modal { position: fixed; inset: 0; background: rgba(10,12,16,.6); display: none; align-items: center; justify-content: center; padding: var(--s3); z-index: 40; }
  .modal.open { display: flex; }
  .dialog { background: var(--page); border: 1px solid var(--rule); border-radius: 1rem; padding: var(--s5); width: min(36rem, 100%); display: flex; flex-direction: column; gap: var(--s3); box-shadow: 0 12px 32px rgba(0,0,0,.35); animation: pop .35s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(.6rem); } to { opacity: 1; transform: none; } }
  .progress { height: .6rem; background: var(--rule); border-radius: 999px; overflow: hidden; } .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
  .tabs { display: flex; gap: var(--s2); border-bottom: 1px solid var(--rule); }
  .tabs button { font: inherit; font-weight: 600; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-soft); padding: var(--s2) var(--s3); cursor: pointer; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--page); }
  td.wrap { white-space: normal; min-width: 14rem; }
  .empty { border: 1px dashed var(--rule); border-radius: var(--r); padding: var(--s5) var(--s4); color: var(--ink-soft); }
  .empty b { color: var(--ink); display: block; font-size: var(--t-l); margin-bottom: var(--s1); }
  .rule { background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s3); }
  .rule .label { display: block; margin-bottom: var(--s1); }
  .stepn { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: inline-grid; place-items: center; font: 700 var(--t-s) var(--font); border: 2px solid var(--rule); color: var(--ink-soft); margin-right: var(--s2); }
  .stepn.done { background: var(--good); border-color: var(--good); color: #fff; } .stepn.here { border-color: var(--accent); color: var(--accent-ink); }
  .chartbox { position: relative; display: flex; flex-direction: column; gap: var(--s2); }
  .legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); font-size: var(--t-s); color: var(--ink-soft); }
  .legend i { display: inline-block; width: 1.1rem; height: .2rem; border-radius: 2px; margin-right: .45rem; vertical-align: middle; background: var(--accent); }
  .legend i.dash { background: repeating-linear-gradient(90deg, var(--ink-soft) 0 4px, transparent 4px 7px); }
  .legend b { color: var(--ink); font-family: var(--font); margin-left: .35rem; }
  .tipbox { position: absolute; pointer-events: none; background: var(--ink); color: var(--page); border-radius: var(--r); padding: var(--s2) var(--s3); font-size: var(--t-s);
            display: none; white-space: nowrap; z-index: 3; line-height: 1.5; }
  .tipbox i { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .4rem; background: var(--accent); } .tipbox i.g { background: var(--ink-soft); }
  .tipbox b { font-family: var(--font); float: right; margin-left: var(--s3); } .tipbox .d { opacity: .7; }
  /* tour */
  #tourblock { position: fixed; inset: 0; z-index: 50; display: none; }
  #spot { position: fixed; z-index: 51; border-radius: .8rem; box-shadow: 0 0 0 200vmax rgba(10,12,16,.66); pointer-events: none; display: none; transition: left .5s var(--ease), top .5s var(--ease), width .5s var(--ease), height .5s var(--ease); }
  #spot::after { content: ""; position: absolute; inset: -4px; border: 3px solid var(--accent); border-radius: 1rem; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }
  #tip { position: fixed; z-index: 52; width: min(23rem, calc(100vw - 2rem)); background: var(--page); border: 1px solid var(--rule); border-radius: 1rem; padding: var(--s4); display: none; flex-direction: column; gap: var(--s3);
         box-shadow: 0 12px 32px rgba(0,0,0,.4); transition: left .5s var(--ease), top .5s var(--ease); }
  #tip h2 { font-size: var(--t-l); } #tip .txt { animation: rise .4s var(--ease); display: flex; flex-direction: column; gap: var(--s2); }
  .eyebrow { font: 700 var(--t-xs) var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
  .dots { display: flex; gap: .35rem; align-items: center; } .dots i { width: .5rem; height: .5rem; border-radius: 50%; background: var(--rule); transition: all .3s var(--ease); }
  .dots i.on { background: var(--accent); width: 1.4rem; border-radius: 999px; }
  .tour-on #tourblock, .tour-on #spot { display: block; } .tour-on #tip { display: flex; }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s var(--ease) forwards; } .draw.b { animation-delay: .4s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fadein { opacity: 0; animation: rise .5s var(--ease) 1.9s forwards; }
  #confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; width: 100%; height: 100%; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; } }
  @media (max-width: 900px) {
    html, body, .app { height: auto; } .app { grid-template-columns: minmax(0, 1fr); } .brand { width: auto; }
    nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--rule); } nav .grp { display: none; }
    main { overflow: visible; padding: var(--s3); } .grid2 { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sample"><b>Prototype.</b> Every strategy, trade and number here is invented sample data.</div>
  <div class="bar" id="bar"></div>
  <nav aria-label="Sections" id="nav"></nav>
  <main id="scroll"><div class="wrap" id="view"></div></main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div class="dialog" id="dialog"></div></div>
<div id="tourblock"></div><div id="spot"></div><div id="tip" role="dialog" aria-live="polite" aria-label="Tour"></div>
<canvas id="confetti" hidden></canvas>

<script>
/* ---------- sample data ---------- */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function walk(seed, n, total, vol) { var r = rng(seed), v = 0, raw = [0], i, k; for (i = 1; i < n; i++) { v += (r() - 0.5) * vol; raw.push(v); }
  var end = raw[n - 1], out = raw.map(function (x, j) { return 10000 * (1 + x - end * j / (n - 1) + total / 100 * j / (n - 1)); });
  for (k = 0; k < 2; k++) out = out.map(function (y, j) { return j === 0 || j === n - 1 ? y : (out[j - 1] + 2 * y + out[j + 1]) / 4; }); return out; }
var STR = [
  { id: "ma", name: "MA Crossover", on: "SPY", status: "Running", since: "13 Aug 2026", ret: 4.8, hold: 3.1, sharpe: 0.92, expect: 0.71, wins: 7, n: 12, fall: 3.4, pos: "Holding 41 shares", signal: "Hold", why: "Short average still above long average. No cross today.", seed: 11, match: [20, 21], settings: "short 15, long 80, trend 150", lossToday: 0.4 },
  { id: "mom", name: "Momentum 12-1", on: "QQQ", status: "Running", since: "03 Sep 2026", ret: -1.9, hold: 2.2, sharpe: -0.31, expect: 0.64, wins: 3, n: 9, fall: 6.8, pos: "No position", signal: "Stay out", why: "12-month trend turned negative on 28 Oct.", seed: 23, match: [14, 14], settings: "lookback 12 months, skip 1", lossToday: 0 },
  { id: "mr", name: "Mean Reversion", on: "GLD", status: "Paused", since: "21 Jul 2026", ret: 1.2, hold: 5.6, sharpe: 0.28, expect: 0.55, wins: 11, n: 19, fall: 4.1, pos: "No position", signal: "Paused", why: "You paused this strategy on 02 Nov.", seed: 37, match: [31, 34], settings: "window 10 days, band 2.0", lossToday: 0 },
  { id: "draft1", draft: true, name: "Trend Pullback", on: "SPY", status: "Draft", since: "", ret: 0, hold: 0, sharpe: 0, expect: 0.58, wins: 0, n: 1, fall: 0, pos: "No position", signal: "Draft", why: "", seed: 53, match: [0, 0], settings: "short 20, long 50, trend 200", lossToday: 0 }
];
STR.forEach(function (s) { var r = rng(s.seed);
  s.curve = walk(s.seed, 90, s.ret, 0.011); s.holdCurve = walk(s.seed + 500, 90, s.hold, 0.009);
  var days = ["10 Nov", "05 Nov", "30 Oct", "22 Oct", "15 Oct", "07 Oct", "29 Sep", "18 Sep", "09 Sep", "01 Sep", "24 Aug", "14 Aug"], px = 400 + s.seed * 3; s.trades = [];
  for (var i = 0; i < Math.min(12, s.n + 3); i++) { var sell = i % 2 === 0, res = sell ? +(((r() < s.wins / s.n ? 1 : -1) * (0.4 + r() * 2.6))).toFixed(1) : null; px += (r() - 0.5) * 14;
    s.trades.push({ day: days[i], act: sell ? "Sell" : "Buy", price: px.toFixed(2), size: 38 + Math.round(r() * 6), res: res, safe: i === 3 && s.id === "ma" ? "Blocked" : "Allowed" }); }
  s.tests = [
    { t: "Live vs backtest", d: "10 Nov", r: s.match[0] === s.match[1] ? ["good", "All " + s.match[1] + " days match"] : ["warn", s.match[0] + " of " + s.match[1] + " days match"] },
    { t: "Backtest", d: "08 Nov", r: ["", "Score " + s.expect.toFixed(2)] },
    { t: "Luck test", d: "04 Nov", r: s.id === "mr" ? ["bad", "Beat 81 of 100"] : ["good", "Beat " + (s.id === "ma" ? 97 : 96) + " of 100"] },
    { t: "Final exam", d: "06 Aug", r: s.id === "mr" ? ["", "Not taken"] : ["good", "Passed"] } ];
});
var FAST = [5, 10, 15, 20, 25, 30], SLOW = [40, 60, 80, 100, 120];
var VIR = [[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[109,205,89],[180,222,44],[253,231,37]];
function ramp(p) { p = Math.max(0, Math.min(1, p)) * 9; var i = Math.min(8, Math.floor(p)), f = p - i, a = VIR[i], b = VIR[i + 1]; return "rgb(" + [0, 1, 2].map(function (k) { return Math.round(a[k] + (b[k] - a[k]) * f); }).join(",") + ")"; }

  if (t.dataset.act === "draftTest") { S.tested = true; render(); return; }
  if (t.dataset.act === "kill") { confirmDlg(S.kill ? "Allow buying again" : "Stop all buying", "<p>" + (S.kill ? "Strategies may place buy orders again." : "No strategy may open a new position until you switch this off. Selling is still allowed.") + "</p>", S.kill ? "ALLOW" : "STOP", function () { S.kill = !S.kill; render(); }); return; }
  if (t.dataset.range) { S.range = +t.dataset.range; render(); } else if (t.dataset.tf) { S.tf = t.dataset.tf; render(); } else if (t.dataset.bt) { S.bt = t.dataset.bt; render(); }
  else if (t.dataset.cell) { var p = t.dataset.cell.split(","); S.sel = cat(+p[0], +p[1]); render(); }
  else if (t.dataset.act === "job") jobDlg(t.dataset.title, +t.dataset.mins); else if (t.dataset.act === "tour") welcome();
  else if (t.dataset.act === "pause") { var s = cur(), on = s.status === "Running"; confirmDlg((on ? "Pause " : "Resume ") + s.name, "<p>" + (on ? "It stops placing orders. Any open position stays as it is." : "It starts checking prices and placing practice orders again.") + "</p>", on ? "PAUSE" : "RESUME",
    function () { s.status = on ? "Paused" : "Running"; s.signal = on ? "Paused" : "Hold"; s.why = on ? "You paused this strategy just now." : "Resumed. Waiting for the next check."; render(); }); } });
document.addEventListener("change", function (e) { var t = e.target; if (t.id === "strat") { S.sid = t.value; render(); } else if (t.dataset.cmp) { S.cmp[+t.dataset.cmp] = t.value; render(); } });
document.addEventListener("keydown", function (e) { if (ti >= 0) { if (e.key === "Escape") tourEnd(false); else if (e.key === "ArrowRight") tourGo(ti + 1); else if (e.key === "ArrowLeft") tourGo(ti - 1); } else if (e.key === "Escape") closeDlg(); });
